[project]
name = "victory-fitness-backend"
version = "0.1.0"
description = "FastAPI backend for Victory Fitness."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.34.0",
    "motor==3.6.0",
    "dnspython==2.8.0",
    "pydantic[email]==2.13.4",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "boto3==1.39.4",
    "langchain-core==1.3.3",
    "langchain-openai==1.2.1",
    "langchain-anthropic==1.4.3",
    "Pillow==11.2.1",
    "pypdf==5.9.0",
    "python-docx==1.1.2",
    "stripe==12.5.1",
    "resend==2.39.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
