services:
  api:
    build: .
    container_name: victory-backend-api
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: victory-backend-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
